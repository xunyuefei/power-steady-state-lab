<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>47 核心公式独立手算校验台 · 华电 811/812 考研专用</title>
  <!-- PWA 元数据与图标 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="电分校验台">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-D-zzVgej.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DFuukeav.css">
</head>
<body>
  <!-- 顶部悬浮控制栏 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-group">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1 class="brand-title">电力系统稳态分析 · 47 必背公式独立手算校验台</h1>
          <span class="brand-subtitle">华北电力大学 811 / 812 考研专业课高精度快速核验专用 · 单纯对应输入数字</span>
        </div>
      </div>

      <!-- 全局快速搜索与统计 -->
      <div class="search-box-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="global-search-input" placeholder="输入公式名/编号(#08)/符号(RT, ΔU, xΔ, Pk)..." autocomplete="off" spellcheck="false">
        <kbd class="search-kbd">⌘K / Esc</kbd>
      </div>

      <!-- 快捷操作区 -->
      <div class="header-actions">
        <button id="btn-pwa-install" class="action-btn install-btn" style="display: none;" title="将本校验台安装为独立 App (离线自习室可用)">
          📱 安装到桌面
        </button>
        <button id="btn-reset-all" class="action-btn secondary-btn" title="将所有公式重置为华电考研标准典型算例">
          🔄 载入全套真题算例
        </button>
        <button id="btn-theme-toggle" class="action-btn icon-btn" title="切换深色/浅色主题">
          🌓
        </button>
      </div>
    </div>

    <!-- 章节快速筛选标签栏 -->
    <nav class="chapter-capsule-bar" id="chapter-nav">
      <!-- 动态生成章节胶囊按钮 -->
    </nav>
  </header>

  <!-- 主体内容容器 -->
  <main class="main-container">
    <!-- 状态与快捷提示 -->
    <div class="toolbar-status-row">
      <div class="status-summary">
        <span class="count-badge" id="visible-count-badge">显示 47 / 47 个独立公式卡片</span>
        <span class="mode-tip">💡 每个卡片均独立自包含：公式在眼前，输入数字即时输出高精校验结果与草稿纸代入式</span>
      </div>
      <div class="view-mode-group">
        <button class="view-btn active" data-view="grid" id="btn-view-grid" title="网格平铺全览，多公式同时核算">网格全览</button>
        <button class="view-btn" data-view="focus" id="btn-view-focus" title="单卡全屏专注模式">聚焦模式</button>
      </div>
    </div>

    <!-- 47 独立公式卡片网格容器 -->
    <div class="cards-grid" id="formula-cards-grid">
      <!-- 动态渲染 47 个独立公式卡片 -->
    </div>
  </main>

  <!-- 浮动通知 Toast -->
  <div id="toast-container" class="toast-container"></div>

</body>
</html>
